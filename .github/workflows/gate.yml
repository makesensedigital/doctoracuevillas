# The delivery gate — Handbook §26.
#
# THIS WORKFLOW IS THE PUBLICATION ORIGIN. Publishing from a branch means the push *is* the deploy
# and there is no point at which anything can refuse — which is the structural reason this class of
# work tends to have no verification at all: there would be nowhere to put it.
#
# So: set the repository's publishing source to GitHub Actions (or the equivalent on your host), and
# `publish` runs only after `gate` passes.
#
# §20's five stages are declared INAPPLICABLE for this class, by name and with the reason — there is
# no build, no type system, no unit suite and no dependency tree here. This replaces them. Dropping
# them silently is the failure the handbook names elsewhere.
#
# WHY EVERY CHECK RUNS EVEN AFTER ONE FAILS
#
# The first version of this file was one job of sequential steps, and the first failure hid the nine
# results after it. That turns one pass into a queue: fix, re-run, discover the next, re-run. A
# lint's output is input to the next turn (§20), and a report that stops at the first line is a
# worse input than one that lists everything wrong at once. So the checks run in two parallel jobs,
# every step is `if: '!cancelled()'`, and `gate` is the single thing to require in branch
# protection.
#
# TOOLING POLICY
#
# The site's own checks are Node stdlib, in `scripts/`, with no dependencies at all. Two external
# tools are pinned by exact version and fetched with `npx --yes`, the pattern the Central Standards
# CI already uses. Bumping one of these versions is a change with a proposal, not a convenience
# edit: §22 treats CI configuration as privileged surface.
#
# It was three. The accessibility CLI was removed after its first run on a real runner failed
# because the driver it bundles was tied to a Chrome the runner no longer had — see the note where
# it used to be. Pinning a tool without pinning the browser it drives is not a pin.

name: Delivery gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ the site's own rules
  # Seconds, no network, no dependencies. These are the rules no general-purpose tool knows about,
  # which is exactly why §20 says to promote a rule into code when documentation fails to hold it.
  checks:
    name: Site rules (§26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The gate's own test
        # Runs first and asserts BOTH directions — a correct site passes every check, and each
        # deliberate defect is caught by the check that owns it. A check that has never failed on
        # purpose is not known to work; a check that fires on correct input teaches people to route
        # around the gate. This has already found four defects in the checks themselves.
        if: ${{ !cancelled() }}
        run: node scripts/test-gate.mjs

      - name: One configuration module, no placeholders
        if: ${{ !cancelled() }}
        run: node scripts/check-config.mjs

      - name: Business facts derive from one source
        if: ${{ !cancelled() }}
        run: node scripts/build-derived.mjs --check

      - name: Indexability and the mobile render rules (§26, §6c)
        if: ${{ !cancelled() }}
        run: node scripts/check-markup.mjs

      - name: Byte budgets, orphans and third-party origins
        if: ${{ !cancelled() }}
        run: node scripts/check-assets.mjs

      - name: No tracked secret or internal material (§4c)
        # The repository is the web root: a committed file is a published file. This is the last
        # line, not the mechanism — `.gitignore` is where the decision lives.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(ai|psd|sketch|fig|env|pem|key|p12|pfx)$|(^|/)(Branding|drafts|client)/'; then
            echo "::error::Internal material is tracked, and in this architecture tracked means published (Handbook §26)."
            exit 1
          fi
          echo "OK — nothing internal is tracked."

  # ------------------------------------------------------------------ external tools, pinned
  # Minutes, and independent of the job above so a placeholder left in `config.js` never hides a
  # performance regression.
  external:
    name: Links, accessibility, performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Serve the site the way the host serves it
        # NOT a plain file server. This site's canonical URLs are extensionless because the host
        # resolves them that way, and a plain file server answers 404 for every one of them — the
        # link check would go red across the whole site while the live site works, and the obvious
        # way to make it green would be to write the wrong URLs into the markup.
        run: |
          node scripts/serve.mjs --port 8080 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null

      - name: Links resolve, including retired destinations
        if: ${{ !cancelled() }}
        run: |
          npx --yes linkinator@6.1.2 http://127.0.0.1:8080/ \
            --recurse \
            --skip '^https?://(?!127\.0\.0\.1)' \
            --verbosity error

      # NO SEPARATE ACCESSIBILITY STEP, and the reason is worth keeping.
      #
      # This job originally ran a pinned accessibility CLI, and on its first execution on a real
      # runner it failed for a reason that had nothing to do with the site: the CLI bundles a driver
      # tied to one Chrome version, the runner's Chrome had moved, and the step errored before
      # testing anything. A gate that goes red for reasons unrelated to the site is a gate people
      # switch off — the failure mode §20 warns about, arriving through the supply chain rather than
      # through a bad rule.
      #
      # Lighthouse's accessibility category IS axe-core, and it manages its own browser. So the
      # coverage moved there, backed by explicit assertions on the load-bearing audits rather than
      # by an aggregate score alone. What no tool covers — the keyboard walkthrough — stays in the
      # pull-request checklist, where it always was.

      - name: Mobile performance and accessibility thresholds
        # A threshold with no job that runs it produces the same software as no threshold. The
        # floors live in lighthouserc.json so a loosened one shows up in a diff and has to be
        # argued for.
        if: ${{ !cancelled() }}
        run: npx --yes @lhci/cli@0.14.0 autorun

  # ------------------------------------------------------------------ the single required check
  gate:
    name: Delivery gate
    needs: [checks, external]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          set -euo pipefail
          echo "site rules : ${{ needs.checks.result }}"
          echo "external   : ${{ needs.external.result }}"
          if [ "${{ needs.checks.result }}" != "success" ] || [ "${{ needs.external.result }}" != "success" ]; then
            echo "::error::The gate did not pass. Every failing check is listed in the two jobs above — fix them together rather than one per run."
            exit 1
          fi
          echo "Gate passed. Publication happens only from this workflow, never from a branch (§26)."

  # ------------------------------------------------------------------ publication
  # THE HOST IS CLOUDFLARE PAGES, not GitHub Pages, and that is a decision recorded in brief.md
  # rather than a preference. GitHub Pages serves no custom response headers and issues no real
  # redirects, which makes `_headers` and `_redirects` inert — no content policy, and no protection
  # against framing at all on a site that gives medical information.
  #
  # Deployment is by DIRECT UPLOAD from this job, deliberately, rather than by connecting the host's
  # own Git integration. The integration would deploy on push, which makes the push the deploy and
  # leaves no point at which anything can refuse — the exact failure the gate exists to prevent.
  #
  # PUBLICATION IS OFF UNTIL SOMEBODY TURNS IT ON. Set the repository variable PUBLISH_ENABLED to
  # `true` once the Cloudflare project exists, the domain resolves, and the two secrets below are
  # present. Until then this job does not run, and nothing is published by merging.
  publish:
    name: Publish
    needs: gate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://doctoracuevillas.com/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A deploy that runs with an empty token does not fail loudly on every host — some publish an
      # empty or partial site. Refusing here is cheaper than discovering it live.
      - name: Refuse to deploy without credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::PUBLISH_ENABLED is true but the Cloudflare credentials are missing. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets, or set PUBLISH_ENABLED back to false."
            exit 1
          fi
          echo "OK — credentials present."

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.99.0 pages deploy . \
            --project-name=doctoracuevillas \
            --branch=main \
            --commit-dirty=true
